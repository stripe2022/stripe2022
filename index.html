<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Escáner QR Vertical</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: black;
      font-family: sans-serif;
      color: white;
    }

    #reader {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      display: none;
      z-index: 1000;
    }

    #result {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 20px;
      z-index: 1001;
    }

    #startBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1002;
      font-size: 18px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background-color: #28a745;
      color: white;
      cursor: pointer;
    }

    #startBtn:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <button id="startBtn" onclick="scanCode()">📷 Escanear código</button>
  <div id="reader"></div>
  <div id="result"></div>

  <script>
    let scanner = null;

    function scanCode() {
      document.getElementById("reader").style.display = "block";
      document.getElementById("startBtn").style.display = "none";
      document.getElementById("result").innerText = "";

      const config = {
        fps: 10,
        qrbox: { width: 500, height: 900 }, // <<== VERTICAL: 900px de alto
        videoConstraints: {
          facingMode: { exact: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 1920 }
        }
      };

      if (!scanner) {
        scanner = new Html5Qrcode("reader");
      }

      scanner.start(
        config.videoConstraints,
        config,
        (decodedText) => {
          document.getElementById("result").innerText = "✅ Código escaneado: " + decodedText;
          scanner.stop().then(() => {
            document.getElementById("reader").style.display = "none";
            document.getElementById("startBtn").style.display = "block";
          });
        },
        (errorMessage) => {
          console.warn("Intento fallido:", errorMessage);
        }
      ).catch((err) => {
        console.error("No se pudo iniciar el escaneo:", err);
        alert("Error iniciando la cámara.");
        document.getElementById("reader").style.display = "none";
        document.getElementById("startBtn").style.display = "block";
      });
    }
  </script>
</body>
</html>
