<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Escáner QR y de Barras - ZXing</title>
  <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: black;
      color: white;
      text-align: center;
    }
    #video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
    #result {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 100%;
      font-size: 1.4rem;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
    }
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline></video>
  <div id="result">📷 Escaneando...</div>

  <script>
    const codeReader = new ZXing.BrowserMultiFormatReader();
    const videoElement = document.getElementById('video');
    const resultElement = document.getElementById('result');

    codeReader
      .listVideoInputDevices()
      .then(videoInputDevices => {
        // Usa la primera cámara trasera disponible
        const backCamera = videoInputDevices.find(device => device.label.toLowerCase().includes('back')) || videoInputDevices[0];

        return codeReader.decodeFromVideoDevice(backCamera.deviceId, videoElement, (result, err) => {
          if (result) {
            resultElement.innerText = `✅ Código detectado: ${result.getText()}`;
          } else if (err && !(err instanceof ZXing.NotFoundException)) {
            console.error(err);
            resultElement.innerText = '❌ Error en escaneo';
          }
        });
      })
      .catch(err => {
        console.error(err);
        resultElement.innerText = '🚫 No se pudo acceder a la cámara';
      });
  </script>
</body>
</html>
