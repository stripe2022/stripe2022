<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Escáner QR y de Barras</title>
  <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    #video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    #result {
      position: absolute;
      bottom: 20px;
      width: 100%;
      font-size: 1.2rem;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 10px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline></video>
  <div id="result">📷 Escaneando...</div>

  <script>
    const codeReader = new ZXing.BrowserMultiFormatReader();
    const videoElement = document.getElementById('video');
    const resultElement = document.getElementById('result');

    async function iniciarEscaneo() {
      try {
        const devices = await codeReader.listVideoInputDevices();
        const backCamera = devices.find(d => d.label.toLowerCase().includes('back')) || devices[0];

        // Establecer los formatos que quieres escanear
        const formatos = [
          ZXing.BarcodeFormat.QR_CODE,
          ZXing.BarcodeFormat.CODE_128,
          ZXing.BarcodeFormat.CODE_39,
          ZXing.BarcodeFormat.EAN_13,
          ZXing.BarcodeFormat.EAN_8,
          ZXing.BarcodeFormat.UPC_A,
          ZXing.BarcodeFormat.UPC_E,
          ZXing.BarcodeFormat.ITF,
        ];

        codeReader.hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formatos);

        await codeReader.decodeFromVideoDevice(backCamera.deviceId, videoElement, (result, err) => {
          if (result) {
            const format = result.getBarcodeFormat();
            const text = result.getText();
            console.log("Detectado:", format, text);
            resultElement.innerText = `✅ ${format}: ${text}`;
          } else if (err && !(err instanceof ZXing.NotFoundException)) {
            console.warn("Error escaneando:", err);
            resultElement.innerText = "❌ Error durante escaneo";
          }
        });
      } catch (e) {
        console.error("Error accediendo a la cámara:", e);
        resultElement.innerText = "🚫 No se pudo acceder a la cámara";
      }
    }

    iniciarEscaneo();
  </script>
</body>
</html>
