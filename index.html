<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Escáner QR con jsQR</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    #result {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 20px;
      color: lime;
    }
  </style>
</head>
<body>
  <video id="video" autoplay></video>
  <canvas id="overlay"></canvas>
  <div id="result">Escaneando...</div>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("overlay");
    const context = canvas.getContext("2d");
    const result = document.getElementById("result");

    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "environment",
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    }).then(stream => {
      video.srcObject = stream;
      video.setAttribute("playsinline", true);
      video.play();
      requestAnimationFrame(tick);
    });

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, canvas.width, canvas.height, {
          inversionAttempts: "dontInvert",
        });

        if (code) {
          drawLine(code.location.topLeftCorner, code.location.topRightCorner, "red");
          drawLine(code.location.topRightCorner, code.location.bottomRightCorner, "red");
          drawLine(code.location.bottomRightCorner, code.location.bottomLeftCorner, "red");
          drawLine(code.location.bottomLeftCorner, code.location.topLeftCorner, "red");
          result.innerText = `✅ Código detectado: ${code.data}`;
        } else {
          result.innerText = "Escaneando...";
        }
      }
      requestAnimationFrame(tick);
    }

    function drawLine(begin, end, color) {
      context.beginPath();
      context.moveTo(begin.x, begin.y);
      context.lineTo(end.x, end.y);
      context.lineWidth = 4;
      context.strokeStyle = color;
      context.stroke();
    }
  </script>
</body>
</html>
