      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 20px;
      z-index: 1001;
    }

    #startBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1002;
      font-size: 18px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background-color: #28a745;
      color: white;
      cursor: pointer;
    }

    #startBtn:hover {
      background-color: #218838;
    }
  </style>
